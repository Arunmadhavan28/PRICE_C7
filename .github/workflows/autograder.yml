name: Retail AI Autograder

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  evaluate-submissions:
    name: Grade Submission (100 pts to 25 Marks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Test Suites
        id: pytest_run
        run: |
          python -m pytest teams/ -v || true

      - name: Run Automated Evaluator and Scorecard
        id: autograde
        run: |
          python evaluator/autograder.py --all --github-summary --output scorecard.md || true
          cat scorecard.md

      - name: Post Scorecard Comment on Pull Request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('scorecard.md')) {
              const body = fs.readFileSync('scorecard.md', 'utf8');
              const header = "### Retail AI Autograder Results\n\n";
              
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });
              
              const botComment = comments.find(c => c.body.includes("Retail AI Autograder Results"));
              
              if (botComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body: header + body
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: header + body
                });
              }
            }

      - name: Final Status Check
        run: |
          python -c "print('Evaluation completed successfully. Check Job Summary and PR Comments for scorecard.')"
